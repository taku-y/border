[package]
name = "dqn_atari_async_tch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
log = "0.4"
anyhow = "1.0.38"
clap = { version = "4.5.8", features = ["derive"] }
env_logger = "0.8.2"
numpy = "0.25"
tch = { version = "0.24.0" }
border-tch-agent = { version = "0.0.9", path = "../../../border-tch-agent", features = ["border-async-trainer"]}
border-core = { version = "0.0.9", path = "../../../border-core" }
border-generic-replay-buffer = { version = "0.0.9", path = "../../../border-generic-replay-buffer" }
border-tensorboard = { version = "0.0.9", path = "../../../border-tensorboard" }
border-mlflow-tracking = { version = "0.0.9", path = "../../../border-mlflow-tracking" }
border-atari-env = { version = "0.0.9", path = "../../../border-atari-env", features = ["tch"]}
border-async-trainer = { version = "0.0.9", path = "../../../border-async-trainer" }
serde = "1.0.194"
serde_yaml = "0.8.7"

[dev-dependencies]
tempdir = "0.3.7" 